<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Ramses Pierre</title>
    <meta name="description" content="Página de contato do portfólio pessoal de Ramses Pierre.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <a class="logo" href="index.html">Ramses Pierre</a>
            <ul class="nav-menu">
                <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                <li class="nav-item"><a class="nav-link" href="curriculo.html">Currículo</a></li>
                <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfólio</a></li>
                <li class="nav-item"><a class="nav-link active" href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="section container-contato">
            <h1 class="section-title">Contato</h1>
            <p class="subtitle">Envie a sua mensagem e vamos conversar sobre o próximo projeto.</p>
            <form id="form" class="form-contato" action="https://app.web3forms.com/submit" method="POST">
                
                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input class="texto-input" type="text" name="nome" id="nome" required placeholder="Digite seu nome completo">
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input class="texto-input" type="email" name="email" id="email" required placeholder="seu.email@exemplo.com">
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input class="texto-input" type="tel" name="telefone" id="telefone" required placeholder="(00) 00000-0000">
                </div>
                <div class="form-group">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem"></textarea>
                </div>
                <div class="h-captcha" data-captcha="true"></div>
                <button class="btn btn-submit" type="submit">Enviar Mensagem</button>
            </form>
        </section>
    </main>
    <footer class="footer">
        <div class="footer-inner">
            <ul class="social-links">
                <li><a href="https://br.linkedin.com/in/ramses-pierre-1a7a8757/" target="_blank" rel="noopener noreferrer"><img src="imagem/linkedin.png" alt="LinkedIn"></a></li>
                <li><a href="#" target="_blank" rel="noopener noreferrer"><img src="imagem/facebook.png" alt="Facebook"></a></li>
                <li><a href="#" target="_blank" rel="noopener noreferrer"><img src="imagem/instagram.jpeg" alt="Instagram"></a></li>
            </ul>
            <p>&copy; 2026 Ramses Pierre. Todos os direitos reservados.</p>
        </div>
    </footer>
    <script src="script.js"></script>
    <script src="https://web3forms.com/client/script.js" async defer></script>

</body>
</html>
